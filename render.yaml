services:
  - type: web
    name: sharprunner-api-andreii2305
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm ci
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: DEVELOPER_SETUP_KEY
        generateValue: true
      - key: REQUIRE_FILE_SCANNING
        value: "false"
      - key: LESSON_UPLOAD_MAX_FILES
        value: "5"
      - key: LESSON_UPLOAD_MAX_MB
        value: "25"
      # Wired automatically to the dedicated .NET runner below.
      - key: PRACTICE_RUNNER_URL
        fromService:
          type: web
          name: sharprunner-practice-runner
          # Free web services cannot receive private-network traffic. Use the
          # runner's Render-managed public HTTPS URL; /run still requires the
          # generated shared bearer token below.
          envVarKey: RENDER_EXTERNAL_URL
      - key: PRACTICE_RUNNER_TOKEN
        fromService:
          type: web
          name: sharprunner-practice-runner
          envVarKey: PRACTICE_RUNNER_TOKEN
      - key: PRACTICE_RUNNER_TIMEOUT_MS
        value: "5000"
      - key: PRACTICE_RUNNER_BUILD_TIMEOUT_MS
        value: "30000"
      - key: PRACTICE_RUNNER_WAKE_TIMEOUT_MS
        value: "75000"
      - key: PRACTICE_RUNNER_OUTPUT_LIMIT
        value: "32768"

  - type: web
    name: sharprunner-practice-runner
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.practice-runner
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PRACTICE_RUNNER_TOKEN
        generateValue: true
      - key: PRACTICE_RUNNER_MODE
        value: direct
      - key: PRACTICE_DOTNET_TARGET
        value: net8.0
      - key: PRACTICE_RUNNER_TIMEOUT_MS
        value: "5000"
      - key: PRACTICE_RUNNER_BUILD_TIMEOUT_MS
        value: "30000"
      - key: PRACTICE_RUNNER_OUTPUT_LIMIT
        value: "32768"
      - key: PRACTICE_RUNNER_MAX_CONCURRENT
        value: "1"
