services:
  - type: web
    name: sharprunner-api-andreii2305
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm ci
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: DEVELOPER_SETUP_KEY
        generateValue: true
      - key: REQUIRE_FILE_SCANNING
        value: "false"
      - key: LESSON_UPLOAD_MAX_FILES
        value: "5"
      - key: LESSON_UPLOAD_MAX_MB
        value: "25"
